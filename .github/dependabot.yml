version: 2

updates:
  # Actions are pinned to commit SHAs and the linters are pinned by image
  # digest, which is what stops a moved tag changing what runs here. It is
  # also what stops them updating on their own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # wrangler is pinned exactly and runs with a token that can deploy the worker
  # serving pkg.haus. Pinning is what stops it changing on its own; this is
  # what stops it going stale.
  #
  # The directory is /worker, not /. The failure is silent in both directions:
  # an entry pointing at a directory with no manifest finds nothing and reports
  # nothing, which reads exactly like coverage. Check the path, not the
  # presence of a config.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
