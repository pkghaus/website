name = "pkghaus-website"
compatibility_date = "2026-08-01"

# No `main`. This Worker is nothing but the asset layer, which is why a request
# matching no file gets a 404 from it rather than reaching GitHub Pages: with
# no script there is nothing to call fetch(request). Pages stays deployed, but
# as the rollback target rather than a live fallback. Deleting or narrowing
# this route is what returns the site to it.
routes = [
  { pattern = "pkg.haus/*", zone_name = "pkg.haus" },
]

[assets]
# The repository root: this site is 8 files at the top level, and .assetsignore
# keeps everything that is not the site out.
directory = ".."

# Without this a miss returns 404 with an EMPTY body, losing the 404.html that
# Pages serves today. Measured both ways against a scratch Worker.
not_found_handling = "404-page"
